            Trening
          </button>
          <button type="button" class="segment-btn ${state.activitySubTab === 'nutrition' ? 'active' : ''}" onclick="switchSubTab('activity', 'nutrition')">
            Żywienie
          </button>
          <button type="button" class="segment-btn ${state.activitySubTab === 'exercises' ? 'active' : ''}" onclick="switchSubTab('activity', 'exercises')">
            Atlas ćwiczeń
          </button>
          <button type="button" class="segment-btn ${state.activitySubTab === 'progress' ? 'active' : ''}" onclick="switchSubTab('activity', 'progress')">
            Postępy
          </button>
        </div>

        ${state.activitySubTab === 'training' ? renderTrainingSubView() : ''}
        ${state.activitySubTab === 'nutrition' ? renderNutritionSubView() : ''}
        ${state.activitySubTab === 'exercises' ? renderExercisesCatalogSubView() : ''}
        ${state.activitySubTab === 'progress' ? renderProgressSubView() : ''}
      `;
    }

    function renderTrainingSubView() {
      const volumeKg = getWorkoutVolumeKg();
      return `
        <h1 class="page-title">Plan treningowy</h1>

        <div class="card">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <span class="badge badge-strava">Mikrocykl Góra / Dół</span>
            <span style="font-size:12px; color:var(--text-secondary); font-weight:600;">Objętość dziś: ${formatNumberPL(volumeKg)} kg</span>
          </div>
          <h3 style="font-size:16px; font-weight:800; margin-bottom:10px;">${state.workout.planName}</h3>
          <div style="margin-bottom:14px;">
            ${state.workout.exercises.map((ex, i) => {
              const doneCount = ex.sets.filter(s => s.done).length;
              const firstWeight = ex.sets[0] ? ex.sets[0].weight : 0;
              return `
                <div class="list-row">
                  <div>
                    <div style="color:var(--text-primary); font-weight:700; font-size:13px;">${i + 1}. ${ex.name}</div>
                    <div style="color:var(--text-secondary); font-size:11.5px; margin-top:2px;">
                      ${firstWeight > 0 ? `${formatDecimalPL(firstWeight)} kg` : 'Masa ciała'} · ${ex.muscle}
                    </div>
                  </div>
                  <span class="badge ${doneCount === ex.sets.length ? 'badge-mint' : ''}">${doneCount}/${ex.sets.length} serii</span>
                </div>
              `;
            }).join('')}
          </div>
          <button type="button" class="btn btn-strava" onclick="navigate('active-workout')">
            <i data-lucide="play" style="width:16px;height:16px;fill:currentColor;"></i>
            Otwórz dziennik serii
          </button>
        </div>

        <div class="section-header">
          <span class="section-title">Ostatnie aktywności (Kliknij po szczegóły)</span>
        </div>
        <div class="grouped-list">
          <div class="list-row interactive" onclick="openActivityHistoryModal('hist-1')" role="button" tabindex="0" onkeydown="if(event.key==='Enter') openActivityHistoryModal('hist-1')">
            <div>
              <div style="font-weight:700; font-size:13.5px;">Dół ciała A — FitFabric Manufaktura</div>
              <div style="font-size:11.5px; color:var(--text-secondary); margin-top:2px;">22 października · 54 min · Objętość: 6 420 kg</div>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="badge badge-mint">+140 EXP</span>
              <i data-lucide="chevron-right" style="width:15px;height:15px" class="mono-icon"></i>
            </div>
          </div>
          <div class="list-row interactive" onclick="openActivityHistoryModal('hist-2')" role="button" tabindex="0" onkeydown="if(event.key==='Enter') openActivityHistoryModal('hist-2')">
            <div>
              <div style="font-weight:700; font-size:13.5px;">Szosa — Las Łagiewnicki</div>
              <div style="font-size:11.5px; color:var(--text-secondary); margin-top:2px;">20 października · 42,5 km · Śr. 29,4 km/h</div>
            </div>
            <div style="display:flex; align-items:center; gap:6px;">
              <span class="badge badge-strava">Strava</span>
              <i data-lucide="chevron-right" style="width:15px;height:15px" class="mono-icon"></i>
            </div>
          </div>
        </div>
      `;
    }

    function renderActiveWorkoutScreen() {
      const exIdx = state.workout.currentExerciseIdx;
      const ex = state.workout.exercises[exIdx];
      const setsProgress = getWorkoutSetsProgress();
      const sessionVolumeKg = getWorkoutVolumeKg();
      const mins = String(Math.floor(state.workout.restTimerSeconds / 60)).padStart(2, '0');
      const secs = String(state.workout.restTimerSeconds % 60).padStart(2, '0');
      const timerPct = state.workout.restTimerInitial > 0
        ? Math.round((state.workout.restTimerSeconds / state.workout.restTimerInitial) * 100)
        : 0;

      return `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span class="badge badge-strava">Ćwiczenie ${exIdx + 1} z ${state.workout.exercises.length}</span>
          <div style="font-size:11.5px; font-weight:700; color:var(--text-secondary); display:flex; gap:10px;">
            <span>Serie: <strong style="color:var(--text-primary)">${setsProgress.done} / ${setsProgress.total}</strong></span>
            <span>Objętość: <strong id="live-workout-volume" style="color:var(--accent-mint-bright)">${formatNumberPL(sessionVolumeKg)} kg</strong></span>
          </div>
        </div>

        <div class="filter-pills">
          ${state.workout.exercises.map((item, idx) => {
            const doneC = item.sets.filter(s => s.done).length;
            return `
              <button type="button" class="filter-pill ${idx === exIdx ? 'active' : ''}" onclick="state.workout.currentExerciseIdx=${idx}; render(false)">
                ${idx + 1}. ${item.name.split(' ')[0]} (${doneC}/${item.sets.length})
              </button>
            `;
          }).join('')}
        </div>

        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div>
              <div style="font-size:11px; color:var(--accent-mint-bright); font-weight:700; text-transform:uppercase;">${ex.muscle}</div>
              <h2 style="font-size:17px; font-weight:800; margin:3px 0 4px 0;">${ex.name}</h2>
            </div>
            <a href="${ex.ytUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-sm" title="Zobacz technikę wideo">
              <i data-lucide="play-circle" style="width:14px;height:14px"></i> Wideo
            </a>
          </div>

          <table class="sets-table" aria-label="Tabela serii ćwiczenia">
            <thead>
              <tr>
                <th>Seria</th>
                <th>Poprzednio</th>
                <th style="text-align:center;">Ciężar (kg)</th>
                <th style="text-align:center;">Powt.</th>
                <th style="text-align:right;">Status</th>
              </tr>
            </thead>
            <tbody>
              ${ex.sets.map((s, sIdx) => `
                <tr class="set-row ${s.done ? 'completed' : ''}">
                  <td style="font-weight:800; font-size:13px; color:var(--text-secondary);">#${sIdx + 1}</td>
                  <td style="font-size:11.5px; color:var(--text-secondary);">${ex.prevResult}</td>
                  <td style="text-align:center;">
                    <input type="number" step="0.5" class="set-input" aria-label="Ciężar w serii ${sIdx + 1}" value="${s.weight}" oninput="updateSetData(${exIdx}, ${sIdx}, 'weight', this.value)" />
                  </td>
                  <td style="text-align:center;">
                    <input type="number" class="set-input" aria-label="Powtórzenia w serii ${sIdx + 1}" value="${s.reps}" oninput="updateSetData(${exIdx}, ${sIdx}, 'reps', this.value)" />
                  </td>
                  <td style="text-align:right;">
                    <button type="button" class="set-check-btn ${s.done ? 'done' : ''}" onclick="toggleWorkoutSet(${exIdx}, ${sIdx})" aria-label="Zatwierdź serię ${sIdx + 1}">
                      <i data-lucide="check" style="width:16px;height:16px"></i>
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div style="display:flex; gap:8px; margin-top:12px;">
            <button type="button" class="btn btn-secondary btn-sm" style="flex:1;" onclick="addExtraSet(${exIdx})">
              <i data-lucide="plus" style="width:14px;height:14px"></i> Dodaj serię
            </button>
            ${exIdx < state.workout.exercises.length - 1 ? `
              <button type="button" class="btn btn-primary btn-sm" style="flex:1;" onclick="state.workout.currentExerciseIdx += 1; render(false)">
                Następne ćwiczenie <i data-lucide="arrow-right" style="width:14px;height:14px"></i>
              </button>
            ` : ''}
          </div>
        </div>

        <button type="button" class="btn btn-strava" onclick="finishWorkoutSession()">
          <i data-lucide="flag" style="width:16px;height:16px"></i>
          Zakończ i zapisz trening
        </button>

        <div class="floating-rest-bar" role="region" aria-label="Timer przerwy między seriami">
          <div style="display:flex; align-items:center; gap:10px;">
            ${createRadialGaugeSVG(timerPct, 40, 4, '#3ED6A3', '', '', 'rest-timer-ring', 'rgba(255,255,255,0.16)')}
            <div>
              <div style="font-size:10px; font-weight:700; text-transform:uppercase; color:#8E95B2;">Przerwa</div>
              <div id="rest-timer-display" style="font-size:18px; font-weight:800; color:#F5F6FA; letter-spacing:0.5px;">${mins}:${secs}</div>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button type="button" class="rest-bar-btn" onclick="toggleRestTimer()">
              <i data-lucide="${state.workout.restTimerRunning ? 'pause' : 'play'}" style="width:13px;height:13px"></i>
              ${state.workout.restTimerRunning ? 'Pauza' : 'Start'}
            </button>
            <button type="button" class="rest-bar-btn" onclick="adjustRestTimer(15)">+15 s</button>
            <button type="button" class="rest-bar-btn" onclick="resetRestTimer()">Reset</button>
          </div>
        </div>
      `;
    }

    function updateSetData(exIdx, setIdx, field, val) {
      const num = Number(val);
      if (!Number.isNaN(num) && num >= 0) {
        state.workout.exercises[exIdx].sets[setIdx][field] = num;
        const volEl = document.getElementById('live-workout-volume');
        if (volEl) {
          volEl.textContent = `${formatNumberPL(getWorkoutVolumeKg())} kg`;
        }
      }
    }

    function toggleWorkoutSet(exIdx, setIdx) {
      const ex = state.workout.exercises[exIdx];
      const targetSet = ex.sets[setIdx];
      targetSet.done = !targetSet.done;

      if (targetSet.done) {
        state.workout.restTimerSeconds = 90;
        state.workout.restTimerInitial = 90;
        startRestTimerAutomatically();

        const allDone = ex.sets.every(s => s.done);
        if (allDone && exIdx < state.workout.exercises.length - 1) {
          showToast(`Ukończono wszystkie serie! Przechodzę do: ${state.workout.exercises[exIdx + 1].name}`);
          state.workout.currentExerciseIdx = exIdx + 1;
        } else {
          showToast(`Zapisano serię #${setIdx + 1} (Objętość sesji: ${formatNumberPL(getWorkoutVolumeKg())} kg)`);
        }
      }
      render(false);
    }

    function addExtraSet(exIdx) {
      const ex = state.workout.exercises[exIdx];
      const last = ex.sets[ex.sets.length - 1] || { weight: 20, reps: 10 };
      ex.sets.push({ weight: last.weight, reps: last.reps, done: false });
      showToast(`Dodano serię #${ex.sets.length}`);
      render(false);
    }

    function adjustRestTimer(sec) {
      state.workout.restTimerSeconds += sec;
      if (state.workout.restTimerSeconds > state.workout.restTimerInitial) {
        state.workout.restTimerInitial = state.workout.restTimerSeconds;
      }
      updateTimerTextOnly();
    }

    function updateTimerTextOnly() {
      const timerEl = document.getElementById('rest-timer-display');
      if (timerEl) {
        const mins = String(Math.floor(state.workout.restTimerSeconds / 60)).padStart(2, '0');
        const secs = String(state.workout.restTimerSeconds % 60).padStart(2, '0');
        timerEl.textContent = `${mins}:${secs}`;
      }
      const ringEl = document.getElementById('rest-timer-ring');
      if (ringEl) {
        const radius = (40 - 4) / 2;
        const circumference = 2 * Math.PI * radius;
        const pct = state.workout.restTimerInitial > 0
          ? Math.max(0, Math.min(100, (state.workout.restTimerSeconds / state.workout.restTimerInitial) * 100))
          : 0;
        const dashOffset = circumference - (pct / 100) * circumference;
        ringEl.setAttribute('stroke-dashoffset', dashOffset.toFixed(1));
      }
    }

    function startRestTimerAutomatically() {
      if (restInterval) clearInterval(restInterval);
      state.workout.restTimerRunning = true;
      restInterval = setInterval(() => {
        if (state.workout.restTimerSeconds > 0) {
          state.workout.restTimerSeconds -= 1;
          if (state.currentScreen === 'active-workout') updateTimerTextOnly();
        } else {
          clearInterval(restInterval);
          state.workout.restTimerRunning = false;
          showToast('Czas przerwy minął — pora na kolejną serię!');
          if (state.currentScreen === 'active-workout') render(false);
        }
      }, 1000);
    }

    function toggleRestTimer() {
      if (state.workout.restTimerRunning) {
        clearInterval(restInterval);
        state.workout.restTimerRunning = false;
        render(false);
      } else {
        startRestTimerAutomatically();
        render(false);
      }
    }

    function resetRestTimer() {
      if (restInterval) clearInterval(restInterval);
      state.workout.restTimerRunning = false;
      state.workout.restTimerSeconds = 90;
      state.workout.restTimerInitial = 90;
      render(false);
    }

    function finishWorkoutSession() {
      if (restInterval) clearInterval(restInterval);
      state.workout.restTimerRunning = false;
      triggerLevelUpModal();
      openTab('today');
    }

    /* ATLAS ĆWICZEŃ */
    function getFilteredExercisesHTML() {
      const filtered = state.exerciseCatalog.filter(e => {
        const matchCat = state.exerciseFilter === 'Wszystkie' || e.muscle.includes(state.exerciseFilter.split(' ')[0]);
        const matchSearch = e.name.toLowerCase().includes(state.exerciseSearch.toLowerCase()) || e.muscle.toLowerCase().includes(state.exerciseSearch.toLowerCase());
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        return `<div class="card" style="text-align:center; color:var(--text-secondary);">Brak ćwiczeń spełniających kryteria.</div>`;
      }

      return filtered.map(ex => `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span class="badge badge-mint">${ex.muscle}</span>
            <span style="font-size:11px; font-weight:600; color:var(--text-secondary);">${ex.level}</span>
          </div>
          <h3 style="font-size:14.5px; font-weight:800; margin-bottom:4px;">${ex.name}</h3>
          <div style="font-size:12px; color:var(--text-secondary); margin-bottom:12px;">Sprzęt: ${ex.equipment}</div>
          <div style="display:flex; gap:8px;">
            <a href="${ex.yt}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-sm" style="flex:1;">
              <i data-lucide="play-circle" style="width:14px;height:14px"></i>
              Instrukcja wideo
            </a>
            <button type="button" class="btn btn-primary btn-sm" onclick="addExerciseToActiveWorkout('${ex.name}', '${ex.muscle}', '${ex.yt}')">
              Dodaj do planu
            </button>
          </div>
        </div>
      `).join('');
    }

    function handleExerciseSearchInput(val) {
      state.exerciseSearch = val;
      const listContainer = document.getElementById('exercise-catalog-results');
      if (listContainer) {
        listContainer.innerHTML = getFilteredExercisesHTML();
        lucide.createIcons();
      }
    }

    function renderExercisesCatalogSubView() {
      const categories = ['Wszystkie', 'Klatka piersiowa', 'Plecy / Pośladki', 'Nogi', 'Barki', 'Tenis ziemny'];

      return `
        <h1 class="page-title">Atlas ćwiczeń</h1>

        <div class="form-group">
          <input id="exercise-search-input" type="text" class="form-input" aria-label="Wyszukaj ćwiczenie" placeholder="Szukaj ćwiczenia lub partii mięśniowej..." value="${state.exerciseSearch}" oninput="handleExerciseSearchInput(this.value)" />
        </div>

        <div class="filter-pills">
          ${categories.map(c => `
            <button type="button" class="filter-pill ${state.exerciseFilter === c ? 'active' : ''}" onclick="state.exerciseFilter='${c}'; render(false)">${c}</button>
          `).join('')}
        </div>

        <div id="exercise-catalog-results">
          ${getFilteredExercisesHTML()}
        </div>
      `;
    }

    function addExerciseToActiveWorkout(name, muscle, ytUrl) {
      const exists = state.workout.exercises.some(e => e.name === name);
      if (exists) {
        showToast('To ćwiczenie znajduje się już w planie');
        return;
      }
      state.workout.exercises.push({
        name,
        muscle,
        prevResult: 'Nowe ćwiczenie',
        ytUrl,
        sets: [
          { weight: 20, reps: 10, done: false },
          { weight: 20, reps: 10, done: false },
          { weight: 20, reps: 10, done: false }
        ]
      });
      showToast('Dodano ćwiczenie do dzisiejszego planu');
    }

    /* DZIENNIK ŻYWIENIA */
    function getEffectiveGrams() {
      const parsed = parseFloat(state.nutrition.selectedGramsRaw);
      return (!Number.isNaN(parsed) && parsed > 0) ? parsed : 100;
    }

    function getProductSearchResultsHTML() {
      const g = getEffectiveGrams();
      const filteredProducts = state.nutrition.productCatalog.filter(prod =>
        prod.name.toLowerCase().includes(state.nutrition.searchQuery.toLowerCase())
      );

      if (filteredProducts.length === 0) {
        return `<div style="padding:12px; text-align:center; font-size:12px; color:var(--text-secondary);">Brak produktów pasujących do zapytania.</div>`;
      }

      return filteredProducts.map((prod, idx) => {
        const calcKcal = Math.round((prod.kcal100 * g) / 100);
        const calcP = Math.round((prod.p100 * g) / 100);
        const calcF = Math.round((prod.f100 * g) / 100);
        const calcC = Math.round((prod.c100 * g) / 100);
        return `
          <div class="list-row">
            <div>
              <div style="font-weight:700; font-size:12.5px;">${prod.name} (${g} g)</div>
              <div style="font-size:11px; color:var(--text-secondary); margin-top:2px;">${calcKcal} kcal · B: ${calcP} g · T: ${calcF} g · W: ${calcC} g</div>
            </div>
            <button type="button" class="btn btn-secondary btn-sm" onclick="addProductToDiary(${idx})">Dodaj</button>
          </div>
        `;
      }).join('');
    }

    function handleNutritionFilterInput() {
      const gramsInput = document.getElementById('meal-grams-input');
      const searchInput = document.getElementById('product-search-input');
      if (gramsInput) state.nutrition.selectedGramsRaw = gramsInput.value;
      if (searchInput) state.nutrition.searchQuery = searchInput.value;

      const resultsBox = document.getElementById('product-search-results');
      if (resultsBox) {
        resultsBox.innerHTML = getProductSearchResultsHTML();
      }
    }

    function renderNutritionSubView() {
      const totals = getNutritionTotals();
      const kcalPct = Math.min(100, Math.round((totals.kcal / state.nutrition.kcalGoal) * 100));
      const pPct = Math.min(100, Math.round((totals.p / state.nutrition.proteinGoal) * 100));
      const fPct = Math.min(100, Math.round((totals.f / state.nutrition.fatGoal) * 100));
      const cPct = Math.min(100, Math.round((totals.c / state.nutrition.carbsGoal) * 100));
      const leftKcal = Math.max(0, state.nutrition.kcalGoal - totals.kcal);

      return `
        <h1 class="page-title">Dziennik żywienia</h1>

        <div class="card">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:14px;">
            <div>
              <span class="badge badge-mint" style="margin-bottom:6px;">Pozostało: ${formatNumberPL(leftKcal)} kcal</span>
              <div class="hero-metric">
                ${formatNumberPL(totals.kcal)}<span class="hero-unit">/ ${formatNumberPL(state.nutrition.kcalGoal)} kcal</span>
              </div>
              <div style="font-size:11.5px; color:var(--text-secondary); margin-top:4px;">Cel dopasowany do dnia treningowego</div>
            </div>
            ${createRadialGaugeSVG(kcalPct, 78, 8, 'var(--accent-mint-bright)', `${kcalPct}%`, 'celu')}
          </div>

          <div class="grid-3">
            <div style="background:var(--bg-elevated); padding:10px; border-radius:14px;">
              <div style="font-size:11px; font-weight:600; color:var(--text-secondary);">Białko</div>
              <div style="font-size:13.5px; font-weight:800; margin:3px 0 6px 0;">${totals.p} / ${state.nutrition.proteinGoal} g</div>
              <div class="progress-track" style="height:5px;"><div class="progress-fill" style="width:${pPct}%;"></div></div>
            </div>
            <div style="background:var(--bg-elevated); padding:10px; border-radius:14px;">
              <div style="font-size:11px; font-weight:600; color:var(--text-secondary);">Tłuszcze</div>
              <div style="font-size:13.5px; font-weight:800; margin:3px 0 6px 0;">${totals.f} / ${state.nutrition.fatGoal} g</div>
              <div class="progress-track" style="height:5px;"><div class="progress-fill" style="width:${fPct}%; background:var(--accent-gold);"></div></div>
            </div>
            <div style="background:var(--bg-elevated); padding:10px; border-radius:14px;">
              <div style="font-size:11px; font-weight:600; color:var(--text-secondary);">Węglowodany</div>
              <div style="font-size:13.5px; font-weight:800; margin:3px 0 6px 0;">${totals.c} / ${state.nutrition.carbsGoal} g</div>
              <div class="progress-track" style="height:5px;"><div class="progress-fill" style="width:${cPct}%; background:var(--accent-water);"></div></div>
            </div>
          </div>
        </div>

        <div class="section-header">
          <span class="section-title">Dodaj produkt do posiłku</span>
        </div>
        <div class="card">
          <div class="grid-2" style="margin-bottom:10px;">
            <div>
              <label class="form-label" for="meal-type-select">Posiłek</label>
              <select id="meal-type-select" class="form-select" onchange="state.nutrition.selectedMealType = this.value">
                ${['Śniadanie', 'Drugie śniadanie', 'Obiad', 'Przekąska', 'Kolacja'].map(m => `
                  <option value="${m}" ${state.nutrition.selectedMealType === m ? 'selected' : ''}>${m}</option>
                `).join('')}
              </select>
            </div>
            <div>
              <label class="form-label" for="meal-grams-input">Gramatura (g)</label>
              <input id="meal-grams-input" type="number" min="1" class="form-input" value="${state.nutrition.selectedGramsRaw}" oninput="handleNutritionFilterInput()" />
            </div>
          </div>

          <div class="form-group" style="margin-bottom:6px;">
            <label class="form-label" for="product-search-input">Wyszukaj produkt</label>
            <input id="product-search-input" type="text" class="form-input" placeholder="Np. kurczak, ryż, twaróg, banan..." value="${state.nutrition.searchQuery}" oninput="handleNutritionFilterInput()" />
          </div>

    function addProductToDiary(prodIdx) {
      const filteredProducts = state.nutrition.productCatalog.filter(prod =>
        prod.name.toLowerCase().includes(state.nutrition.searchQuery.toLowerCase())
      );
      const prod = filteredProducts[prodIdx];
      if (!prod) return;
      const g = getEffectiveGrams();
      const newEntry = {
        id: Date.now(),
        mealType: state.nutrition.selectedMealType,
        name: prod.name,
        grams: g,
        kcal: Math.round((prod.kcal100 * g) / 100),
        p: Math.round((prod.p100 * g) / 100),
        f: Math.round((prod.f100 * g) / 100),
        c: Math.round((prod.c100 * g) / 100)
      };
      state.nutrition.meals.push(newEntry);
      showToast(`Dodano: ${prod.name} (${newEntry.kcal} kcal)`);
      render(false);
    }

      state.nutrition.meals = state.nutrition.meals.filter(m => m.id !== id);

    function publishGroupPost(groupId) {
      const g = state.groups.find(item => item.id === groupId);
      if (!g) return;
      const textEl = document.getElementById('group-post-text');
      const tagEl = document.getElementById('group-post-tag');
      const metricEl = document.getElementById('group-post-metric');
      const text = textEl ? textEl.value.trim() : '';
      if (!text) {
        showToast('Wpisz treść posta przed publikacją');
        return;
      }
      const tag = tagEl ? tagEl.value : 'Osiągnięcie';
      const metric = metricEl ? metricEl.value.trim() : '';

      g.posts.unshift({
        id: 'gp-' + Date.now(),
        author: state.user.name,
        isCurrentUser: true,
        time: 'Przed chwilą',
        tag,
        tagClass: tag.includes('Rekord') ? 'badge-strava' : 'badge-mint',
        text,
        metricHighlight: metric,
        likes: 1,
        liked: true,
        comments: []

      showToast('Opublikowano post na tablicy grupy!');
      render(false);

      const post = g.posts.find(p => p.id === postId);
      if (!post) return;
      post.liked = !post.liked;
      post.likes += post.liked ? 1 : -1;
      render(false);

      const g = state.groups.find(item => item.id === groupId);

      const post = g.posts.find(p => p.id === postId);
      if (!post) return;
      const input = document.getElementById(`comment-input-${postId}`);
      if (!input || !input.value.trim()) return;

      post.comments.push({
        author: state.user.name,
        text: input.value.trim()

      showToast('Dodano komentarz pod postem');
      render(false);

    function initLodzLeafletMap() {
      const mapEl = document.getElementById('lodz-map');
      if (!mapEl || typeof L === 'undefined') return;

      leafletMap = L.map('lodz-map', {
        zoomControl: true
      }).setView([51.7680, 19.4520], 12);

      const tileUrl = state.theme === 'dark'
        ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';

      L.tileLayer(tileUrl, {
        subdomains: 'abcd',
        maxZoom: 19,
        attribution: '© OpenStreetMap · © CARTO'
      }).addTo(leafletMap);

      const customPin = L.divIcon({
        className: '',
        html: '<div class="sm-map-pin"></div>',
        iconSize: [26, 26],
        iconAnchor: [13, 13],
        popupAnchor: [0, -13]
      });

      state.lodzVenues.forEach(v => {
        const marker = L.marker([v.lat, v.lng], { icon: customPin }).addTo(leafletMap);
        marker.bindPopup(`
          <div style="font-family:Inter,sans-serif; min-width:165px; color:#11131A;">
            <strong style="font-size:13px; display:block; margin-bottom:2px;">${v.name}</strong>
            <span style="font-size:11px; color:#63687A; display:block; margin-bottom:4px;">${v.category}</span>
            <span style="font-size:11px; color:#059669; font-weight:700;">Trenuje teraz: ${v.activeUsers} osób</span>
          </div>
        `);
        mapMarkersById[v.id] = marker;
      });

      setTimeout(() => {
        if (leafletMap) leafletMap.invalidateSize();
      }, 120);
    }

    function focusVenueOnMap(id, lat, lng, name) {
      state.activeVenueId = id;
      document.querySelectorAll('.venue-card-slide').forEach(el => {
        el.classList.toggle('active', el.id === `venue-slide-${id}`);
      });
      if (leafletMap) {
        leafletMap.setView([lat, lng], 15, { animate: true });
        if (mapMarkersById[id]) mapMarkersById[id].openPopup();
        showToast(`Wybrano: ${name}`);
      }
    }

    function sendPartnerMessage() {
      const input = document.getElementById('partner-chat-input');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;

      const threadId = state.activeChatThreadId || 'p1';
      const thread = state.chatThreads[threadId];
      if (!thread) return;

      thread.messages.push({ sender: 'Ty', time: 'Teraz', text, incoming: false });
      input.value = '';
      input.focus();

      const chatBox = document.getElementById('partner-chat-box');
      if (chatBox) {
        chatBox.innerHTML = getChatMessagesBubblesHTML(thread.messages, false);
        scrollChatToBottom('partner-chat-box');
      }

      setTimeout(() => {
        thread.messages.push({
          sender: thread.autoReplySender || thread.title,
          time: 'Teraz',
          text: thread.autoReplyText,
          incoming: true
        });
        const activeBox = document.getElementById('partner-chat-box');
        if (state.currentScreen === 'discover' && state.discoverSubTab === 'messages' && state.activeChatThreadId === threadId && activeBox) {
          activeBox.innerHTML = getChatMessagesBubblesHTML(thread.messages, false);
          scrollChatToBottom('partner-chat-box');
        }
      }, 650);
    }

        s.weight = 30;
      });
      state.aiProgressionApplied = true;
      showToast('Zaktualizowano ciężar wyciskania hantli na 30 kg');
      openTab('activity', 'training');
    }

    function askAIPrompt(promptText) {
      state.aiMessages.push({ sender: state.user.creature.name + ' (Ty)', time: 'Teraz', text: promptText, incoming: false });
      const totals = getNutritionTotals();
      const q = promptText.toLowerCase();
      let reply = '';

      if (q.includes('tydzień') || q.includes('regenerac')) {
        reply = `W tym tygodniu zrealizowałeś 2 z 3 sesji siłowych oraz 42,5 km na szosie. Twoje tętno spoczynkowe utrzymuje się na niskim poziomie ${state.user.restingHr} bpm, a gotowość wynosi 89/100. Po sobotnim wspólnym treningu kolarskim w Lesie Łagiewnickim zaplanuj niedzielę na lekki spacer lub mobilizację.`;
      } else if (q.includes('zjeść') || q.includes('posiłek') || q.includes('diet') || q.includes('kalori') || q.includes('białk')) {
        const leftKcal = Math.max(0, state.nutrition.kcalGoal - totals.kcal);
        const leftP = Math.max(0, state.nutrition.proteinGoal - totals.p);
        reply = `Do zamknięcia dzisiejszego bilansu potrzebujesz jeszcze ${formatNumberPL(leftKcal)} kcal oraz ${leftP} g białka. Po sesji „Góra ciała A” świetnie sprawdzi się 200 g chudego twarogu z pieczywem żytnim i bananem (ok. 45 g białka i szybkie uzupełnienie glikogenu).`;
      } else if (q.includes('kolan') || q.includes('ból') || q.includes('kontuzj') || q.includes('przeciąż')) {
        reply = `Przy przeciążeniu stawu kolanowego ogranicz w tym tygodniu zbiegi po asfalcie i zamień wybieganie w Parku na Zdrowiu na jazdę z wyższą kadencją (90–95 obr./min) na rowerze lub pływanie w Zatoce Sportu PŁ. W treningu dołu ciała zastosuj przysiad bułgarski z kontrolowaną fazą ekscentryczną (3 sekundy w dół).`;
      } else if (q.includes('łagiewnik') || q.includes('kolar') || q.includes('rower') || q.includes('tras') || q.includes('tempo')) {
        reply = `Trasa przez Las Łagiewnicki i Wzniesienia Łódzkie (55 km) ma profil pofałdowany. Utrzymuj tętno w II strefie tlenowej (135–148 bpm) na płaskich odcinkach, a na podjazdach pod ul. Wycieczkową nie przekraczaj progu mleczanowego. Zabierz minimum 750 ml izotoniku i 40 g węglowodanów na godzinę jazdy.`;
      } else if (q.includes('sen') || q.includes('tętno') || q.includes('garmin')) {
        reply = `Zegarek Garmin zarejestrował dziś ${state.user.sleepHours} snu oraz tętno spoczynkowe ${state.user.restingHr} bpm. To wynik o 3 bpm lepszy od Twojej średniej z 30 dni, co oznacza brak kumulacji zmęczenia ośrodkowego układu nerwowego.`;
      } else {
        reply = `Jako Twój MateBot przeanalizowałem dzisiejszą gotowość (${state.user.readinessScore}/100) oraz bilans ${formatNumberPL(totals.kcal)} kcal. Zalecam utrzymanie 90-sekundowych przerw między seriami w planie „${state.workout.planName}” i pełną kontrolę fazy negatywnej!`;
      }

      state.aiMessages.push({ sender: 'MateBot · Trener AI', time: 'Teraz', text: reply, incoming: true });

      const aiBox = document.getElementById('ai-chat-box');
      if (aiBox) {
        aiBox.innerHTML = getChatMessagesBubblesHTML(state.aiMessages, true);
        scrollChatToBottom('ai-chat-box');
      } else {
        render(false);
      }
    }

    function sendAIMessage() {
      const input = document.getElementById('ai-chat-input');
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;
      input.value = '';
      input.focus();
      askAIPrompt(val);
    }

    /* ==========================================================================
       6. MODUŁ PROFIL (STWOREK UŻYTKOWNIKA + ODZNAKI BEZ SŁOWA "USTAWKA")
       ========================================================================== */
    function renderHexBadgeSVG(color, iconName) {
      return `
        <div class="hex-icon-wrap">
          <svg width="52" height="52" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="30,3 54,17 54,43 30,57 6,43 6,17" fill="${color}" fill-opacity="0.16" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" />
            <polygon points="30,9 48,20 48,40 30,51 12,40 12,20" fill="${color}" fill-opacity="0.08" />
          </svg>
          <i data-lucide="${iconName}" style="width:20px;height:20px;color:${color};position:absolute;"></i>
        </div>
      `;
    }

    function renderProfileScreen() {
      const expPct = Math.round((state.user.exp / state.user.expNext) * 100);

      return `
        <div class="segmented-control" role="tablist">
          <button type="button" class="segment-btn ${state.profileSubTab === 'overview' ? 'active' : ''}" onclick="switchSubTab('profile', 'overview')">

          </button>
          <button type="button" class="segment-btn ${state.profileSubTab === 'integrations' ? 'active' : ''}" onclick="switchSubTab('profile', 'integrations')">
            Urządzenia
          </button>
          <button type="button" class="segment-btn ${state.profileSubTab === 'settings' ? 'active' : ''}" onclick="switchSubTab('profile', 'settings')">
            Ustawienia

        </div>

        ${state.profileSubTab === 'overview' ? `
          <!-- Nagłówek sportowca ze Stworkiem-Awatarem otoczonym pierścieniem EXP -->
          <div class="card">
            <div style="display:flex; align-items:center; gap:16px; margin-bottom:14px;">
              <div style="position:relative; width:80px; height:80px; flex-shrink:0; cursor:pointer;" onclick="navigate('avatar-creator')" title="Kliknij, aby edytować swojego Stworka">
                <svg width="80" height="80" style="transform: rotate(-90deg); position:absolute; inset:0;">
                  <circle cx="40" cy="40" r="36" fill="none" stroke="var(--bg-elevated)" stroke-width="4" />
                  <circle cx="40" cy="40" r="36" fill="none" stroke="var(--accent-strava)" stroke-width="4"
                    stroke-dasharray="226.2" stroke-dashoffset="${(226.2 - (expPct / 100) * 226.2).toFixed(1)}" stroke-linecap="round" />
                </svg>
                <div style="position:absolute; top:8px; left:8px;">
                  ${renderUserCreatureSVG(state.user.creature, 64, true)}
                </div>
              </div>
              <div style="flex:1;">
                <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">
                  <span class="badge badge-strava">Poziom ${state.user.level}</span>
                  <span class="badge badge-mint">Stworek: ${state.user.creature.name}</span>
                </div>
                <h2 style="font-size:19px; font-weight:800; letter-spacing:-0.4px;">${state.user.name}</h2>
                <div style="font-size:12px; color:var(--text-secondary); margin-top:2px;">${state.user.city}</div>
              </div>
            </div>

            <button type="button" class="btn btn-secondary btn-sm" style="width:100%; margin-bottom:12px;" onclick="navigate('avatar-creator')">
              <i data-lucide="sparkles" style="width:14px;height:14px;color:var(--accent-mint-bright);"></i>
              Personalizuj swojego Stworka (${state.user.creature.name})
            </button>

            <div style="background:var(--bg-elevated); padding:10px 12px; border-radius:14px; margin-bottom:12px;">
              <div style="display:flex; justify-content:space-between; font-size:11.5px; font-weight:700; margin-bottom:6px;">
                <span style="color:var(--text-secondary);">Postęp do Poziomu ${state.user.level + 1}</span>
                <span>${formatNumberPL(state.user.exp)} /${formatNumberPL(state.user.expNext)} EXP</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill" style="width:${expPct}%; background:var(--accent-strava);"></div>
              </div>
            </div>

            <div class="grid-3" style="text-align:center;">
              <div style="background:var(--bg-elevated); padding:10px 6px; border-radius:12px;">
                <div style="font-size:16px; font-weight:800;">318 km</div>
                <div style="font-size:10px; color:var(--text-secondary); font-weight:600; margin-top:2px;">Kolarstwo (30 d)</div>
              </div>
              <div style="background:var(--bg-elevated); padding:10px 6px; border-radius:12px;">
                <div style="font-size:16px; font-weight:800;">14 sesji</div>
                <div style="font-size:10px; color:var(--text-secondary); font-weight:600; margin-top:2px;">Siłownia (30 d)</div>
              </div>
              <div style="background:var(--bg-elevated); padding:10px 6px; border-radius:12px;">
                <div style="font-size:16px; font-weight:800;">#4</div>
                <div style="font-size:10px; color:var(--text-secondary); font-weight:600; margin-top:2px;">Ranking Łódź</div>
              </div>
            </div>
          </div>

          <!-- Odznaki 3D / Hexagonal Badges (Weteran Łagiewnik -> 10 wspólnych sesji) -->
          <div class="section-header">
            <span class="section-title">Zdobyte odznaki Garmin & SportMate</span>
            <button type="button" class="section-link" onclick="triggerLevelUpModal()">+150 EXP</button>
          </div>
          <div class="hex-badge-grid" style="margin-bottom:12px;">
            <div class="hex-badge-card">
              ${renderHexBadgeSVG('#FF6B35', 'bike')}
              <div style="font-size:11.5px; font-weight:800;">300 km Szosa</div>
              <div style="font-size:10px; color:var(--text-secondary);">Październik</div>
            </div>
            <div class="hex-badge-card">
              ${renderHexBadgeSVG('#3ED6A3', 'dumbbell')}
              <div style="font-size:11.5px; font-weight:800;">Klub 50 Ton</div>
              <div style="font-size:10px; color:var(--text-secondary);">Objętość mies.</div>
            </div>
            <div class="hex-badge-card">
              ${renderHexBadgeSVG('#38BDF8', 'flame')}
              <div style="font-size:11.5px; font-weight:800;">Weteran Łagiewnik</div>
              <div style="font-size:10px; color:var(--text-secondary);">10 wspólnych sesji</div>
            </div>
          </div>

          <div class="section-header">
            <span class="section-title">Twoje dyscypliny</span>
          </div>
          <div class="grouped-list">
            ${Object.entries(state.user.sports).map(([sport, level]) => `
              <div class="list-row">
                <span style="font-weight:700;">${sport}</span>
                <span class="badge badge-mint">${level}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${state.profileSubTab === 'integrations' ? `
          <h1 class="page-title">Połączone usługi</h1>

          ${state.integrations.map(intg => `
            <div class="card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <strong style="font-size:14.5px; font-weight:800;">${intg.name}</strong>
                <span class="badge ${intg.connected ? 'badge-mint' : ''}">${intg.connected ? 'Połączono' : 'Rozłączono'}</span>
              </div>
              <div style="font-size:12px; color:var(--text-secondary); margin-bottom:12px;">${intg.desc} · Synchronizacja: ${intg.lastSync}</div>
              <button type="button" class="btn ${intg.connected ? 'btn-secondary' : 'btn-primary'} btn-sm" onclick="toggleIntegration('${intg.id}')">
                ${intg.connected ? 'Synchronizuj / Rozłącz' : 'Połącz konto'}
              </button>
            </div>
          `).join('')}
        ` : ''}

        ${state.profileSubTab === 'settings' ? `
          <h1 class="page-title">Ustawienia</h1>

          <div class="grouped-list">
            <div class="list-row">
              <div>
                <div style="font-weight:700; font-size:13.5px;">Wygląd Twojego Stworka</div>
                <div style="font-size:11.5px; color:var(--text-secondary);">Kolor, uszy, oczy i akcesoria (${state.user.creature.name})</div>
              </div>
              <button type="button" class="btn btn-primary btn-sm" onclick="navigate('avatar-creator')">Edytuj</button>
            </div>
            <div class="list-row">
              <div>
                <div style="font-weight:700; font-size:13.5px;">Motyw ekranu</div>
                <div style="font-size:11.5px; color:var(--text-secondary);">${state.theme === 'dark' ? 'Ciemny OLED (#090A0F)' : 'Jasny iOS (#F2F2F7)'}</div>
              </div>
              <button type="button" class="btn btn-secondary btn-sm" onclick="toggleTheme()">Przełącz</button>
            </div>
            <div class="list-row">
              <div>
                <div style="font-weight:700; font-size:13.5px;">Preferencje sportowe</div>
                <div style="font-size:11.5px; color:var(--text-secondary);">Cele, dyscypliny i promień w Łodzi</div>
              </div>
              <button type="button" class="btn btn-secondary btn-sm" onclick="navigate('onboarding-setup')">Edytuj</button>
            </div>
          </div>

          <button type="button" class="btn btn-danger" style="margin-top:8px;" onclick="navigate('onboarding-splash')">
            Wyloguj się
          </button>
        ` : ''}
      `;
    }

    function toggleIntegration(id) {
      const item = state.integrations.find(i => i.id === id);
      if (item) {
        item.connected = !item.connected;
        item.lastSync = item.connected ? 'Przed chwilą' : 'Nie połączono';
        showToast(item.connected ? `Połączono: ${item.name}` : `Rozłączono: ${item.name}`);
        render(false);
      }
    }

    function renderNotificationsScreen() {
      return `
        <h1 class="page-title">Powiadomienia</h1>

        <div class="grouped-list">
          <div class="list-row interactive" onclick="openChatThread('p1')">
            <div style="display:flex; align-items:center; gap:12px;">
              <img src="${state.partners[0].avatar}" alt="Maja" class="user-avatar" style="width:40px;height:40px;" />
              <div>
                <div style="font-weight:700; font-size:13px;">Maja Wiśniewska wysłała wiadomość</div>
                <div style="font-size:11.5px; color:var(--text-secondary); margin-top:2px;">„Świetnie. A w niedzielę masz ochotę przetestować korty...” · 10:18</div>
              </div>
            </div>
          </div>

            <div style="display:flex; align-items:center; gap:12px;">
              <div class="icon-box" style="color:var(--accent-mint-bright);"><i data-lucide="users" style="width:18px;height:18px"></i></div>
              <div>
                <div style="font-weight:700; font-size:13px;">Nowy post w grupie: Siłownia & Hipertrofia — Łódź</div>
                <div style="font-size:11.5px; color:var(--text-secondary); margin-top:2px;">Bartek Walczak pochwalił się nowym rekordem PR (115,0 kg)</div>
              </div>
            </div>
          </div>
          <div class="list-row interactive" onclick="openTab('discover', 'events')">
            <div style="display:flex; align-items:center; gap:12px;">
              <div class="icon-box" style="color:var(--accent-strava);"><i data-lucide="calendar" style="width:18px;height:18px"></i></div>
              <div>
                <div style="font-weight:700; font-size:13px;">Sobotni trening kolarski — Las Łagiewnicki</div>
                <div style="font-size:11.5px; color:var(--text-secondary); margin-top:2px;">Start o 10:00 · ul. Wycieczkowa (Arturówek)</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      render(true);
    });
  </script>
